<svg xmlns="http://www.w3.org/2000/svg" id="plotarium-diagram" width="480" class="flowchart" height="240" viewBox="4 4 360 57" role="graphics-document document" aria-roledescription="flowchart-v2" preserveAspectRatio="xMidYMid meet" style="max-width: none;"><style>#plotarium-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#plotarium-diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#plotarium-diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#plotarium-diagram .error-icon{fill:#552222;}#plotarium-diagram .error-text{fill:#552222;stroke:#552222;}#plotarium-diagram .edge-thickness-normal{stroke-width:1px;}#plotarium-diagram .edge-thickness-thick{stroke-width:3.5px;}#plotarium-diagram .edge-pattern-solid{stroke-dasharray:0;}#plotarium-diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#plotarium-diagram .edge-pattern-dashed{stroke-dasharray:3;}#plotarium-diagram .edge-pattern-dotted{stroke-dasharray:2;}#plotarium-diagram .marker{fill:#333333;stroke:#333333;}#plotarium-diagram .marker.cross{stroke:#333333;}#plotarium-diagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#plotarium-diagram p{margin:0;}#plotarium-diagram .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#plotarium-diagram .cluster-label text{fill:#333;}#plotarium-diagram .cluster-label span{color:#333;}#plotarium-diagram .cluster-label span p{background-color:transparent;}#plotarium-diagram .label text,#plotarium-diagram span{fill:#333;color:#333;}#plotarium-diagram .node rect,#plotarium-diagram .node circle,#plotarium-diagram .node ellipse,#plotarium-diagram .node polygon,#plotarium-diagram .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#plotarium-diagram .rough-node .label text,#plotarium-diagram .node .label text,#plotarium-diagram .image-shape .label,#plotarium-diagram .icon-shape .label{text-anchor:middle;}#plotarium-diagram .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#plotarium-diagram .rough-node .label,#plotarium-diagram .node .label,#plotarium-diagram .image-shape .label,#plotarium-diagram .icon-shape .label{text-align:center;}#plotarium-diagram .node.clickable{cursor:pointer;}#plotarium-diagram .root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}#plotarium-diagram .arrowheadPath{fill:#333333;}#plotarium-diagram .edgePaths .path{stroke:#333333;stroke-width:1px;}#plotarium-diagram .flowchart-link{stroke:#333333;fill:none;}#plotarium-diagram .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#plotarium-diagram .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#plotarium-diagram .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#plotarium-diagram .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#plotarium-diagram .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#plotarium-diagram .cluster text{fill:#333;}#plotarium-diagram .cluster span{color:#333;}#plotarium-diagram .node .collapsed-indicator{fill:#aaaa33;stroke:none;opacity:0.6;}#plotarium-diagram .node .collapsed-separator{stroke:#aaaa33;stroke-width:0.75px;}#plotarium-diagram div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#plotarium-diagram .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#plotarium-diagram rect.text{fill:none;stroke-width:0;}#plotarium-diagram .icon-shape,#plotarium-diagram .image-shape{background-color:rgba(232,232,232, 0.8);text-align:center;}#plotarium-diagram .icon-shape p,#plotarium-diagram .image-shape p{background-color:rgba(232,232,232, 0.8);padding:2px;}#plotarium-diagram .icon-shape .label rect,#plotarium-diagram .image-shape .label rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#plotarium-diagram .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#plotarium-diagram .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#plotarium-diagram .node .neo-node{stroke:#9370DB;}#plotarium-diagram [data-look="neo"].node rect,#plotarium-diagram [data-look="neo"].cluster rect,#plotarium-diagram [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#plotarium-diagram [data-look="neo"].swimlane.cluster rect{filter:none;}#plotarium-diagram [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#plotarium-diagram [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#plotarium-diagram [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#plotarium-diagram [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#plotarium-diagram [data-look="neo"].node circle .state-start{fill:#000000;}#plotarium-diagram [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#plotarium-diagram [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#plotarium-diagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="plotarium-diagram_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="plotarium-diagram_flowchart-v2-pointStart"